<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пора Закончить спасение</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  body {
    background-image: url('https://i.postimg.cc/7LCNLhkP/98C10CB2-6944-4C7D-B55A-64D129F1839E.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Лёгкое затемнение для читаемости текста */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 20px;
    text-align: center;
  }

  .pumpkin {
    width: clamp(180px, 30vw, 380px);
    height: auto;
    filter: drop-shadow(0 0 30px rgba(255, 140, 0, 0.8))
            drop-shadow(0 0 60px rgba(255, 80, 0, 0.5));
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  .timer {
    display: flex;
    gap: clamp(8px, 2vw, 20px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .timer-box {
    background: rgba(20, 10, 0, 0.55);
    border: 2px solid rgba(255, 150, 40, 0.7);
    border-radius: 12px;
    padding: clamp(8px, 1.6vw, 18px) clamp(12px, 2.4vw, 26px);
    min-width: clamp(70px, 12vw, 120px);
    box-shadow: 0 0 20px rgba(255, 120, 0, 0.5),
                inset 0 0 15px rgba(255, 100, 0, 0.25);
    backdrop-filter: blur(4px);
  }

  .timer-num {
    font-size: clamp(26px, 5vw, 56px);
    color: #ffe0a3;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255,140,0,0.95);
    font-variant-numeric: tabular-nums;
  }

  .timer-label {
    font-size: clamp(10px, 1.2vw, 15px);
    color: #ffb45c;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* Надпись под таймером — меньше и с многоточием */
  .subtitle {
    font-size: clamp(14px, 2vw, 24px);
    color: #ffd27f;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(255,120,0,0.8),
                 0 0 18px rgba(255,60,0,0.5),
                 1px 1px 4px rgba(0,0,0,0.9);
    font-weight: bold;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="container">
    <img class="pumpkin" src="https://i.postimg.cc/QCg9tGCW/pumpkin-1.png" alt="Тыква">
    <div class="timer" id="timer">
      <div class="timer-box"><div class="timer-num" id="days">00</div><div class="timer-label">Дней</div></div>
      <div class="timer-box"><div class="timer-num" id="hours">00</div><div class="timer-label">Часов</div></div>
      <div class="timer-box"><div class="timer-num" id="minutes">00</div><div class="timer-label">Минут</div></div>
      <div class="timer-box"><div class="timer-num" id="seconds">00</div><div class="timer-label">Секунд</div></div>
    </div>
    <div class="subtitle">Пора Закончить спасение...</div>
  </div>

  <script>
    // Дата окончания: 27 сентября 2026, 18:00 (по локальному времени браузера)
    const targetDate = new Date(2026, 8, 27, 18, 0, 0).getTime(); // месяц 8 = сентябрь

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateTimer() {
      const now = Date.now();
      let diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
