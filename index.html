<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Вы пробудили его...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%; overflow: hidden;
    background: #0a0510;
    touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  /* ===== ВОРОНКА ===== */
  #swirl {
    position: fixed; left: 50%; top: 50%;
    width: 200vmax; height: 200vmax;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 1;
    pointer-events: none;
  }
  #swirl.active { opacity: 1; }
  #swirl svg {
    width: 100%; height: 100%; display: block;
    animation: spin 1.1s linear infinite;
    transform-origin: 50% 50%;
    filter: blur(1.5px);
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center,
      rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.85) 100%);
    pointer-events: none; z-index: 2;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #vignette.active { opacity: 1; }

  #center-glow {
    position: fixed; left: 50%; top: 50%;
    width: 70vmin; height: 70vmin;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle,
      rgba(255,160,60,0.55) 0%,
      rgba(180,60,255,0.25) 35%,
      rgba(0,0,0,0) 70%);
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 2; pointer-events: none;
    mix-blend-mode: screen;
  }
  #center-glow.active { opacity: 0.9; }

  /* ===== ТЕКСТ ===== */
  #top-text {
    position: fixed;
    left: 50%; top: 12%;
    transform: translate(-50%, 0);
    font-family: "Georgia", "Times New Roman", serif;
    font-size: clamp(20px, 5.5vw, 42px);
    letter-spacing: 0.15em;
    color: #ffffff;
    text-shadow:
      0 0 10px #fff,
      0 0 25px #d8b8ff,
      0 0 45px #8a4dd6;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 5; pointer-events: none;
    text-align: center; white-space: nowrap;
    font-style: italic; font-weight: 300;
  }
  #top-text.show { opacity: 0.95; }

  /* ===== ТЫКВА ===== */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 3; pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #stage.active { opacity: 1; }
  #pumpkin {
    width: min(72vw, 520px); height: auto;
    filter: drop-shadow(0 0 60px #b388ff) drop-shadow(0 0 110px #ff7a00);
    user-select: none; -webkit-user-drag: none;
    transform-origin: center center;
    animation: shake 0.35s infinite;
  }
  @keyframes shake {
    0%   { transform: translate(0,0) rotate(0deg); }
    10%  { transform: translate(-6px, 2px) rotate(-2deg); }
    20%  { transform: translate(7px, -3px) rotate(2.5deg); }
    30%  { transform: translate(-5px, 3px) rotate(-2deg); }
    40%  { transform: translate(6px, -2px) rotate(2deg); }
    50%  { transform: translate(-7px, 2px) rotate(-2.5deg); }
    60%  { transform: translate(5px, -3px) rotate(1.8deg); }
    70%  { transform: translate(-6px, 3px) rotate(-2.2deg); }
    80%  { transform: translate(7px, -2px) rotate(2.3deg); }
    90%  { transform: translate(-4px, 2px) rotate(-1.5deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }

  /* ===== ЛОАДЕР ===== */
  #preloader {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #1a0d00 0%, #000 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    z-index: 100;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #preloader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #loader-text {
    font-family: "Georgia", serif;
    color: #ffb45c;
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255,120,0,0.9);
    animation: pulse 2s ease-in-out infinite;
    transition: opacity 0.4s ease;
    text-align: center;
  }
  #loader-text.done {
    animation: none;
    color: #ffd27f;
    text-shadow: 0 0 20px rgba(255,180,0,1);
  }
  @keyframes pulse {
    0%,100% { opacity: 0.4; }
    50%     { opacity: 0.9; }
  }

  #continue-btn {
    display: none;
    padding: 16px 46px;
    font-family: 'Georgia', serif;
    font-size: clamp(16px, 2.2vw, 22px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #ffe0a3;
    background: rgba(30, 12, 0, 0.7);
    border: 2px solid rgba(255, 150, 40, 0.85);
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 120, 0, 0.7),
                inset 0 0 20px rgba(255, 100, 0, 0.25);
    text-shadow: 0 0 12px rgba(255,140,0,0.9);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #continue-btn.visible {
    display: inline-block;
    animation: btnAppear 0.8s ease forwards;
  }
  #continue-btn:active {
    transform: scale(0.95);
    box-shadow: 0 0 40px rgba(255, 180, 0, 1),
                inset 0 0 30px rgba(255, 120, 0, 0.5);
  }
  @keyframes btnAppear {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <!-- ЛОАДЕР с кнопкой -->
  <div id="preloader">
    <div id="loader-text">Загрузка...</div>
    <button id="continue-btn">Продолжить</button>
  </div>

  <!-- ФИНАЛЬНЫЙ ЭКРАН (скрыт до нажатия кнопки) -->
  <div id="swirl"><svg id="swirl-svg" viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="center-glow"></div>
  <div id="vignette"></div>

  <div id="top-text">Вы пробудили его...</div>

  <div id="stage"><img id="pumpkin" alt=""></div>

  <!-- МУЗЫКА -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://www.image2url.com/r2/default/audio/1790487611258-1aaad7f4-f971-4b82-8e10-209365425039.mp3" type="audio/mpeg">
  </audio>

<script>
const FINAL_IMG = "https://i.postimg.cc/yxhgd4x9/pumpkin-5.png";
const MITI_IMG  = "https://i.postimg.cc/NMWghw9H/pumpkin-miti.png";

/* ============ СПИРАЛЬ-ЛЕДЕНЕЦ ============ */
(function buildSwirl() {
  const swirlSvg = document.getElementById("swirl-svg");
  const SIZE = 2000, CX = SIZE/2, CY = SIZE/2;
  const MAX_R = 1450, TURNS = 8, STEPS = 1600;
  const SPACING = MAX_R / TURNS;
  const STROKE_PURPLE = SPACING * 1.02;
  const STROKE_ORANGE = SPACING * 0.55;
  const purple = "#7b1fd1";
  const orange = "#ff7a00";
  const deep   = "#2a0047";

  function armPath(angleOffset) {
    let d = "";
    for (let i = 0; i <= STEPS; i++) {
      const t = i / STEPS;
      const a = angleOffset + t * TURNS * Math.PI * 2;
      const r = t * MAX_R;
      const x = CX + Math.cos(a) * r;
      const y = CY + Math.sin(a) * r;
      d += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    }
    return d;
  }

  swirlSvg.innerHTML = `
    <defs>
      <radialGradient id="swirlShade" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.18"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
      </radialGradient>
    </defs>
    <rect width="${SIZE}" height="${SIZE}" fill="${deep}"/>
    <path d="${armPath(0)}"          fill="none" stroke="${purple}"
          stroke-width="${STROKE_PURPLE}" stroke-linecap="round"/>
    <path d="${armPath(Math.PI)}"    fill="none" stroke="${orange}"
          stroke-width="${STROKE_ORANGE}" stroke-linecap="round"/>
    <rect width="${SIZE}" height="${SIZE}" fill="url(#swirlShade)"/>
  `;
})();

/* ============ ЭЛЕМЕНТЫ ============ */
const pumpkinEl  = document.getElementById("pumpkin");
const topTextEl  = document.getElementById("top-text");
const bgMusic    = document.getElementById("bg-music");
const preloader  = document.getElementById("preloader");
const loaderText = document.getElementById("loader-text");
const continueBtn = document.getElementById("continue-btn");

bgMusic.volume = 1.0;

/* ============ ПРЕДЗАГРУЗКА ============ */
let preloadDone = 0;
const needPreload = 2;

function onPreload() {
  preloadDone++;
  if (preloadDone >= needPreload) {
    loaderText.textContent = "Загрузка завершена";
    loaderText.classList.add("done");
    setTimeout(() => continueBtn.classList.add("visible"), 400);
  }
}

const imgFinal = new Image();
imgFinal.onload = imgFinal.onerror = onPreload;
imgFinal.src = FINAL_IMG;

const imgMiti = new Image();
imgMiti.onload = imgMiti.onerror = onPreload;
imgMiti.src = MITI_IMG;

/* Страховка: если через 8 сек не загрузилось — всё равно показываем кнопку */
setTimeout(() => {
  if (preloadDone < needPreload) {
    preloadDone = needPreload;
    loaderText.textContent = "Загрузка завершена";
    loaderText.classList.add("done");
    continueBtn.classList.add("visible");
  }
}, 8000);

/* ============ КНОПКА «ПРОДОЛЖИТЬ» ============ */
continueBtn.addEventListener("click", () => {
  // 1. Запускаем музыку
  bgMusic.play().catch(e => console.warn("Music error:", e));

  // 2. Прячем лоадер
  preloader.classList.add("hide");

  // 3. Ставим финальную тыкву
  pumpkinEl.src = FINAL_IMG;

  // 4. Плавно проявляем всё
  setTimeout(() => {
    document.getElementById("swirl").classList.add("active");
    document.getElementById("center-glow").classList.add("active");
    document.getElementById("vignette").classList.add("active");
    document.getElementById("stage").classList.add("active");
    topTextEl.classList.add("show");
  }, 100);

  // 5. Запускаем мити-мигание
  setInterval(() => {
    pumpkinEl.src = MITI_IMG;
    setTimeout(() => { pumpkinEl.src = FINAL_IMG; }, 140);
  }, 15000);
});
</script>
</body>
</html>
